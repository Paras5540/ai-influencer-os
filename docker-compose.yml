services:
  influencer:
    build: .
    image: influencer-os:latest
    container_name: influencer-os
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Kolkata                 # schedule IST me chalega
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD set karo .env me}
    volumes:
      - ./data:/app/data               # DB + reels + thumbnails yahan rehte hain
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: instant public HTTPS URL (bina domain). Chalao:
  #   docker compose --profile tunnel up -d
  # URL nikalne ke liye: docker logs influencer-tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: influencer-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --url http://localhost:8000
